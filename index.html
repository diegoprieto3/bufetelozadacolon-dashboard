<script>
const CORRECT_PASSWORD = 'LozadaNova2026!';
const STORAGE_KEY = 'lozada_dashboard_auth';
const SUPABASE_URL = 'https://haxozjahcnktbliephdx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhheG96amFoY25rdGJsaWVwaGR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMjgwMzIsImV4cCI6MjA5NzgwNDAzMn0.f5hw4q11wtPeTU6A21xaX9qJdCkFdMWZ1qCKOrwaeZE';
const ASSISTANT_ID = '56952efa-0f8d-4618-8bd7-6d0f86f63342';
const API_KEY = 'e19f3aaf-e171-4e14-80c4-57c4139328e7';
const INTAKE_ID = '04f717a6-4163-4060-82ed-642c54e1701e'; // "Lozada Intake"
const AREA_LABELS = { quiebras: 'Quiebras', civil: 'Civil', notaria: 'Notaría', laboral: 'Laboral', otro: 'Otro' };
const JUNK_DURATION_SECONDS = 17;

let chartInstance = null, monthChartInstance = null;
let allCalls = [], allArchiveCalls = [];
let currentSection = 'dashboard';

/* ---------- helpers ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}
const SB_HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };

/* ---------- auth ---------- */
function isAuthed() { try { return localStorage.getItem(STORAGE_KEY) === 'true'; } catch (e) { return false; } }
function tryLogin() {
  const input = document.getElementById('pw-input');
  const error = document.getElementById('login-error');
  if (input.value === CORRECT_PASSWORD) {
    try { localStorage.setItem(STORAGE_KEY, 'true'); } catch (e) {}
    document.getElementById('login-overlay').classList.add('hidden');
    error.textContent = '';
    input.value = '';
  } else {
    input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
    error.textContent = 'Contraseña incorrecta. Intente de nuevo.';
    input.value = ''; input.focus();
  }
}
function logout() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  document.getElementById('login-overlay').classList.remove('hidden');
}
function togglePw() {
  const input = document.getElementById('pw-input');
  const icon = document.getElementById('eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

/* ---------- data helpers ---------- */
function getIntake(c) {
  const so = c.artifact?.structuredOutputs;
  if (!so || typeof so !== 'object') return {};
  if (so[INTAKE_ID]?.result && typeof so[INTAKE_ID].result === 'object') return so[INTAKE_ID].result;
  const hit = Object.values(so).find(o => o && o.name === 'Lozada Intake' && o.result);
  return hit && typeof hit.result === 'object' ? hit.result : {};
}
function isTrue(v) { return v === true || v === 'true'; }
function getDuration(c) {
  if (c.duration && c.duration > 0) return c.duration;
  const s = c.startedAt || c.started_at, e = c.endedAt || c.ended_at;
  if (s && e) { const d = (new Date(e) - new Date(s)) / 1000; return d > 0 ? d : 0; }
  return 0;
}
function isJunkCall(c) {
  if (getDuration(c) < JUNK_DURATION_SECONDS) return true;
  const reason = (c.endedReason || c.end_reason || '').toLowerCase();
  return ['silence-timed-out', 'no-answer', 'voicemail', 'customer-did-not-give-microphone-permission'].some(r => reason.includes(r));
}
function fmt(sec) { if (!sec || sec <= 0) return '0:00'; return Math.floor(sec/60) + ':' + String(Math.floor(sec%60)).padStart(2,'0'); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-PR', { month:'short', day:'numeric', timeZone:'America/Puerto_Rico' }) + ' · ' + d.toLocaleTimeString('es-PR', { hour:'numeric', minute:'2-digit', timeZone:'America/Puerto_Rico' });
}
function dayKey(iso) { return new Date(iso).toLocaleDateString('en-CA', { timeZone:'America/Puerto_Rico' }); } // YYYY-MM-DD
function fmtDayLabel(key) { const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString('es-PR', { month:'short', day:'numeric' }); }
function monthKey(iso) { return dayKey(iso).slice(0,7); }
function fmtMonthLabel(key) { const [y,m] = key.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('es-PR', { month:'short', year:'2-digit' }); }
function fmtPhone(p) {
  const d = String(p || '').replace(/\D/g,'').slice(-10);
  return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p || 'Número desconocido');
}
function avatarText(phone) { const d = String(phone || '').replace(/\D/g,''); return d.length >= 10 ? d.slice(-10,-7) : (d.slice(0,3) || '?'); }
function isOlderThan14Days(iso) { return iso ? (Date.now() - new Date(iso).getTime()) > 14*24*60*60*1000 : false; }
function toggleCard(el, ev) { if (ev.target.closest('.call-detail')) return; el.classList.toggle('open'); }
function sameMonth(iso, now) { return monthKey(iso) === monthKey(now.toISOString()); }

/* ---------- rendering ---------- */
function renderTranscript(t) {
  if (typeof t === 'string' && t.trim()) {
    return t.split('\n').filter(l => l.trim()).map(l => {
      const m = l.match(/^\s*(AI|Assistant|Bot|User|Customer)\s*:\s*(.*)$/i);
      if (!m) return `<div class="t-line">${esc(l)}</div>`;
      const ai = /^(ai|assistant|bot)$/i.test(m[1]);
      return `<div class="t-line"><span class="${ai ? 't-ai' : 't-user'}">${ai ? 'Asistente' : 'Llamante'}:</span> ${esc(m[2])}</div>`;
    }).join('');
  }
  if (Array.isArray(t) && t.length) {
    return t.map(m => {
      if (m.role === 'system') return '';
      const text = m.content || m.message || m.text || '';
      if (!text.trim()) return '';
      const ai = m.role === 'assistant' || m.role === 'bot';
      return `<div class="t-line"><span class="${ai ? 't-ai' : 't-user'}">${ai ? 'Asistente' : 'Llamante'}:</span> ${esc(text)}</div>`;
    }).join('');
  }
  return '<span style="color:#888;font-size:12px;">Transcripción no disponible</span>';
}
function audioBlock(id, startedAt, hasRecording) {
  if (!hasRecording) return '';
  if (isOlderThan14Days(startedAt)) return `<div class="detail-section"><div class="detail-label">📞 Grabación</div><div class="audio-unavailable">🔒 Audio no disponible — expiró después de 14 días</div></div>`;
  return `<div class="detail-section"><div class="detail-label">📞 Grabación</div><div class="audio-wrap"><audio controls preload="none" id="audio-${esc(id)}"></audio><button class="audio-btn" onclick="loadRecording(this,'${esc(id)}')">▶ Cargar grabación</button></div></div>`;
}
async function loadRecording(btn, callId) {
  const audio = document.getElementById('audio-' + callId);
  if (!audio) return;
  btn.textContent = 'Cargando...';
  try {
    const res = await fetch(`/.netlify/functions/recording?callId=${encodeURIComponent(callId)}`);
    if (!res.ok) throw new Error('Error ' + res.status);
    audio.src = URL.createObjectURL(await res.blob());
    audio.play();
    btn.style.display = 'none';
  } catch (e) { btn.textContent = 'Error al cargar'; }
}
function intakePills(intake) {
  const out = [];
  if (isTrue(intake.urgente)) out.push('<span class="pill pill-urgent">🚨 Urgente</span>');
  if (intake.area && AREA_LABELS[intake.area]) out.push(`<span class="pill pill-area">${AREA_LABELS[intake.area]}</span>`);
  if (isTrue(intake.cliente_nuevo)) out.push('<span class="pill pill-new">Cliente nuevo</span>');
  return out.join('');
}
function intakeGrid(intake, phone) {
  if (!Object.keys(intake).length) return '';
  const yn = v => v === undefined || v === null || v === '' ? '—' : (isTrue(v) ? 'Sí' : 'No');
  const items = [
    ['Nombre', intake.nombre_cliente || '—'],
    ['Teléfono', intake.telefono ? fmtPhone(intake.telefono) : fmtPhone(phone)],
    ['Área', AREA_LABELS[intake.area] || intake.area || '—'],
    ['Tipo', intake.cliente_nuevo === undefined ? '—' : (isTrue(intake.cliente_nuevo) ? 'Cliente nuevo' : 'Cliente existente')],
    ['Urgente', yn(intake.urgente)],
    ['Formulario enviado', yn(intake.enviar_formulario)]
  ];
  return `<div class="detail-section"><div class="detail-label">Ficha de la llamada</div><div class="intake-grid">${items.map(([k,v]) => `<div class="intake-item"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div></div>`;
}
function callCardHTML(c) {
  const intake = getIntake(c);
  const phone = c.customer?.number || '';
  const name = intake.nombre_cliente || '';
  const urgent = isTrue(intake.urgente);
  const summary = c.analysis?.summary || '';
  const motivo = intake.motivo || '';
  return `<div class="call-card${urgent ? ' is-urgent' : ''}" onclick="toggleCard(this, event)">
    <div class="call-row">
      <div class="call-left">
        <div class="call-avatar">${esc(avatarText(phone))}</div>
        <div style="min-width:0;">
          <div class="call-phone">${name ? esc(name) + ' — ' : ''}${esc(fmtPhone(phone))}</div>
          <div class="call-meta"><span>${fmtDate(c.createdAt || c.startedAt)}</span><span>⏱ ${fmt(getDuration(c))}</span></div>
        </div>
      </div>
      <div class="call-right">${intakePills(intake)}<span class="chevron">▾</span></div>
    </div>
    <div class="call-detail">
      ${intakeGrid(intake, phone)}
      ${audioBlock(c.id, c.startedAt || c.createdAt, Boolean(c.artifact?.recordingUrl))}
      ${motivo ? `<div class="detail-section"><div class="detail-label">Motivo de la llamada</div><div class="detail-text">${esc(motivo)}</div></div>` : ''}
      ${summary ? `<div class="detail-section"><div class="detail-label">Resumen</div><div class="detail-text">${esc(summary)}</div></div>` : ''}
      <div class="detail-section"><div class="detail-label">Transcripción</div><div class="transcript-wrap">${renderTranscript(c.artifact?.transcript)}</div></div>
      <div style="font-size:11px;color:var(--muted);">Fin de llamada: ${esc(c.endedReason || c.status || '—')}</div>
    </div>
  </div>`;
}
function archivedCardHTML(c) {
  const phone = c.caller_number || '';
  return `<div class="call-card" onclick="toggleCard(this, event)">
    <div class="call-row">
      <div class="call-left">
        <div class="call-avatar">${esc(avatarText(phone))}</div>
        <div style="min-width:0;">
          <div class="call-phone">${c.caller_name ? esc(c.caller_name) + ' — ' : ''}${esc(fmtPhone(phone))}</div>
          <div class="call-meta"><span>${fmtDate(c.started_at)}</span><span>⏱ ${fmt(c.duration || 0)}</span></div>
        </div>
      </div>
      <div class="call-right"><span class="pill pill-archived">archivado</span><span class="chevron">▾</span></div>
    </div>
    <div class="call-detail">
      ${audioBlock(c.id, c.started_at, Boolean(c.recording_url))}
      ${c.call_reason ? `<div class="detail-section"><div class="detail-label">Motivo de la llamada</div><div class="detail-text">${esc(c.call_reason)}</div></div>` : ''}
      ${c.summary ? `<div class="detail-section"><div class="detail-label">Resumen</div><div class="detail-text">${esc(c.summary)}</div></div>` : ''}
      <div class="detail-section"><div class="detail-label">Transcripción</div><div class="transcript-wrap">${renderTranscript(c.transcript)}</div></div>
    </div>
  </div>`;
}

function renderMetrics(calls) {
  const now = new Date();
  const month = calls.filter(c => sameMonth(c.createdAt || c.startedAt, now));
  const real = month.filter(c => !isJunkCall(c));
  const durations = real.map(getDuration).filter(d => d > 0);
  const avg = durations.length ? durations.reduce((a,b) => a+b, 0) / durations.length : 0;
  document.getElementById('m-total').textContent = month.length;
  document.getElementById('m-total-sub').textContent = `este mes · ${real.length} con interacción`;
  document.getElementById('m-urgent').textContent = month.filter(c => isTrue(getIntake(c).urgente)).length;
  const newOnes = month.filter(c => isTrue(getIntake(c).cliente_nuevo));
  document.getElementById('m-new').textContent = newOnes.length;
  document.getElementById('m-new-sub').textContent = `este mes · ${newOnes.filter(c => isTrue(getIntake(c).enviar_formulario)).length} con formulario`;
  document.getElementById('m-avg').textContent = avg ? fmt(avg) : '—';
  document.getElementById('m-last').textContent = calls[0] ? 'Última: ' + fmtDate(calls[0].createdAt || calls[0].startedAt) : 'por llamada';

  const dayMap = {};
  month.forEach(c => { const k = dayKey(c.createdAt || c.startedAt); dayMap[k] = (dayMap[k] || 0) + 1; });
  const keys = Object.keys(dayMap).sort();
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const wrap = document.getElementById('calls-chart-wrap');
  if (!keys.length) { wrap.innerHTML = '<div style="text-align:center;padding:2rem;color:#888;font-size:13px;">No hay llamadas este mes todavía</div>'; return; }
  if (!document.getElementById('callsChart')) wrap.innerHTML = '<canvas id="callsChart"></canvas>';
  if (typeof Chart === 'undefined') return;
  chartInstance = new Chart(document.getElementById('callsChart'), {
    type: 'bar',
    data: { labels: keys.map(fmtDayLabel), datasets: [{ data: keys.map(k => dayMap[k]), backgroundColor: '#163360', hoverBackgroundColor: '#1B3B6E', borderRadius: 6, borderSkipped: false }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false }, ticks: { font: { size: 11, family: 'Work Sans' }, color: '#888', maxRotation: 45 } },
                y: { beginAtZero: true, grid: { color: 'rgba(22,51,96,0.07)' }, ticks: { stepSize: 1, font: { size: 11, family: 'Work Sans' }, color: '#888' } } } }
  });
}
function renderCalls(calls) {
  const list = document.getElementById('call-list');
  const real = calls.filter(c => !isJunkCall(c));
  if (!real.length) { list.innerHTML = `<div class="empty-state"><div class="empty-icon">📵</div><p>No hay llamadas todavía.</p></div>`; return; }
  list.innerHTML = real.slice(0, 10).map(callCardHTML).join('');
  if (real.length > 10) list.innerHTML += `<div style="text-align:center;padding:1rem;font-size:13px;color:var(--muted);">Mostrando 10 de ${real.length} — <span style="color:var(--navy);cursor:pointer;font-weight:600;" onclick="showSection('calllog')">Ver todas →</span></div>`;
}
function renderCallLogFull() {
  const list = document.getElementById('calllog-list');
  const hideJunk = document.getElementById('junk-filter-toggle').checked;
  const onlyUrgent = document.getElementById('urgent-filter-toggle').checked;
  const area = document.getElementById('area-filter').value;
  let filtered = allCalls;
  if (hideJunk) filtered = filtered.filter(c => !isJunkCall(c));
  if (onlyUrgent) filtered = filtered.filter(c => isTrue(getIntake(c).urgente));
  if (area) filtered = filtered.filter(c => getIntake(c).area === area);
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📵</div><p>No hay llamadas con estos filtros.</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(callCardHTML).join('');
  if (hideJunk) {
    const hidden = allCalls.filter(isJunkCall).length;
    if (hidden > 0) list.innerHTML += `<div style="text-align:center;padding:1rem;font-size:12px;color:var(--muted);">${hidden} llamada${hidden===1?'':'s'} sin interacción oculta${hidden===1?'':'s'} (menos de ${JUNK_DURATION_SECONDS}s o sin respuesta)</div>`;
  }
}
function barRows(map, total) {
  const entries = Object.entries(map).sort((a,b) => b[1] - a[1]);
  if (!entries.length) return '<div style="color:#888;font-size:13px;">Sin datos todavía</div>';
  return entries.map(([label, n]) => `<div class="stat-row" style="display:block;"><div style="display:flex;justify-content:space-between;"><span class="label">${esc(label)}</span><span class="value">${n}</span></div><div class="bar-track"><div class="bar-fill" style="width:${total ? Math.round(n/total*100) : 0}%"></div></div></div>`).join('');
}
function renderIntakeAnalytics() {
  const real = allCalls.filter(c => !isJunkCall(c));
  const areas = {}, types = {};
  real.forEach(c => {
    const i = getIntake(c);
    const a = AREA_LABELS[i.area] || 'Sin clasificar';
    areas[a] = (areas[a] || 0) + 1;
    const t = i.cliente_nuevo === undefined ? 'Sin clasificar' : (isTrue(i.cliente_nuevo) ? 'Cliente nuevo' : 'Cliente existente');
    types[t] = (types[t] || 0) + 1;
  });
  const urgent = real.filter(c => isTrue(getIntake(c).urgente)).length;
  if (urgent) types['🚨 Urgentes'] = urgent;
  document.getElementById('a-areas').innerHTML = barRows(areas, real.length);
  document.getElementById('a-types').innerHTML = barRows(types, real.length);
}
async function loadAnalytics() {
  renderIntakeAnalytics();
  const rDiv = document.getElementById('a-reasons');
  rDiv.innerHTML = '<div class="loading-state" style="padding:1rem;"><span class="spin">↻</span></div>';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/calls?assistant_id=eq.${ASSISTANT_ID}&order=started_at.desc&limit=5000`, { headers: SB_HEADERS });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || ('Error ' + res.status));
    const rows = await res.json();
    const durations = rows.map(r => r.duration || 0).filter(d => d > 0);
    const total = durations.reduce((a,b) => a+b, 0);
    document.getElementById('a-total').textContent = rows.length;
    document.getElementById('a-avg').textContent = durations.length ? fmt(total / durations.length) : '—';
    document.getElementById('a-completed').textContent = rows.filter(r => r.end_reason === 'customer-ended-call' || r.end_reason === 'assistant-ended-call').length;
    document.getElementById('a-time').textContent = total ? Math.round(total/60) + ' min' : '—';
    const reasons = {};
    rows.forEach(r => { const k = r.end_reason || 'desconocido'; reasons[k] = (reasons[k] || 0) + 1; });
    rDiv.innerHTML = Object.entries(reasons).sort((a,b) => b[1]-a[1]).map(([r,n]) => `<div class="stat-row"><span class="label">${esc(r)}</span><span class="value">${n}</span></div>`).join('') || '<div style="color:#888;font-size:13px;">Sin datos todavía</div>';
    const monthMap = {};
    rows.forEach(r => { if (r.started_at) { const k = monthKey(r.started_at); monthMap[k] = (monthMap[k] || 0) + 1; } });
    const mKeys = Object.keys(monthMap).sort();
    if (monthChartInstance) monthChartInstance.destroy();
    if (mKeys.length && typeof Chart !== 'undefined') {
      monthChartInstance = new Chart(document.getElementById('monthChart'), {
        type: 'bar',
        data: { labels: mKeys.map(fmtMonthLabel), datasets: [{ data: mKeys.map(k => monthMap[k]), backgroundColor: '#1B3B6E', borderRadius: 6, borderSkipped: false }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
          scales: { x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#888' } }, y: { beginAtZero: true, grid: { color: 'rgba(22,51,96,0.07)' }, ticks: { stepSize: 1, font: { size: 11 }, color: '#888' } } } }
      });
    }
  } catch (e) {
    rDiv.innerHTML = `<div style="color:var(--red);font-size:12px;">Error al cargar analíticas: ${esc(e.message)}</div>`;
  }
}

async function loadArchive() {
  const list = document.getElementById('archive-list');
  list.innerHTML = '<div class="loading-state"><span class="spin">↻</span> Cargando archivo...</div>';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/calls?assistant_id=eq.${ASSISTANT_ID}&order=started_at.desc&limit=2000`, { headers: SB_HEADERS });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || ('Error ' + res.status));
    allArchiveCalls = await res.json();
    populateArchiveMonthFilter(allArchiveCalls);
    filterArchive();
  } catch (e) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p style="color:var(--red);">Error al cargar el archivo.</p><span style="font-size:12px;">${esc(e.message)}</span></div>`;
  }
}
function populateArchiveMonthFilter(calls) {
  const select = document.getElementById('archive-month-filter');
  const current = select.value;
  const names = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const keys = [...new Set(calls.filter(c => c.started_at).map(c => monthKey(c.started_at)))].sort().reverse();
  select.innerHTML = '<option value="">Todos los meses</option>' + keys.map(k => { const [y,m] = k.split('-'); return `<option value="${k}">${names[Number(m)-1]} ${y}</option>`; }).join('');
  if (keys.includes(current)) select.value = current;
}
function filterArchive() {
  const list = document.getElementById('archive-list');
  const q = document.getElementById('archive-search').value.trim().toLowerCase();
  const mk = document.getElementById('archive-month-filter').value;
  let filtered = allArchiveCalls;
  if (mk) filtered = filtered.filter(c => c.started_at && monthKey(c.started_at) === mk);
  if (q) filtered = filtered.filter(c => [c.caller_number, c.caller_name, c.call_reason, c.summary].filter(Boolean).join(' ').toLowerCase().includes(q));
  if (!allArchiveCalls.length) { list.innerHTML = `<div class="empty-state"><div class="empty-icon">🗄️</div><p>No hay llamadas archivadas todavía.</p></div>`; return; }
  if (!filtered.length) { list.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>No se encontraron llamadas con esos filtros.</p></div>`; return; }
  list.innerHTML = filtered.map(archivedCardHTML).join('');
}

async function loadCalls() {
  document.getElementById('call-list').innerHTML = '<div class="loading-state"><span class="spin">↻</span> Cargando llamadas...</div>';
  try {
    const res = await fetch(`https://api.vapi.ai/call?limit=1000&assistantId=${ASSISTANT_ID}`, { headers: { 'Authorization': 'Bearer ' + API_KEY } });
    if (!res.ok) throw new Error('API returned ' + res.status);
    const data = await res.json();
    const calls = Array.isArray(data) ? data : (data.results || data.calls || []);
    calls.sort((a,b) => new Date(b.createdAt || b.startedAt) - new Date(a.createdAt || a.startedAt));
    allCalls = calls;
    renderMetrics(allCalls);
    renderCalls(allCalls);
    if (currentSection === 'calllog') renderCallLogFull();
    if (currentSection === 'analytics') renderIntakeAnalytics();
  } catch (e) {
    document.getElementById('call-list').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p style="color:var(--red);">No se pudieron cargar las llamadas.</p><span style="font-size:12px;">${esc(e.message)}</span></div>`;
  }
}

function showSection(section) {
  currentSection = section;
  ['dashboard','calllog','analytics','archive'].forEach(s => {
    document.getElementById('section-' + s).style.display = s === section ? '' : 'none';
    document.getElementById('nav-' + s).classList.toggle('active', s === section);
    document.getElementById('mob-' + s).classList.toggle('active', s === section);
  });
  const titles = {
    dashboard: ['Bufete Lozada Colón', 'Recepcionista Virtual — Panel de Llamadas'],
    calllog: ['Registro de Llamadas', 'Todas las llamadas entrantes'],
    analytics: ['Analíticas', 'Resumen de rendimiento'],
    archive: ['Archivo', 'Llamadas guardadas permanentemente']
  };
  document.getElementById('page-title').textContent = titles[section][0];
  document.getElementById('page-sub').textContent = titles[section][1];
  if (section === 'calllog') renderCallLogFull();
  if (section === 'analytics') loadAnalytics();
  if (section === 'archive') loadArchive();
  window.scrollTo(0, 0);
}
function refreshCurrent() {
  if (currentSection === 'archive') loadArchive();
  else if (currentSection === 'analytics') { loadCalls(); loadAnalytics(); }
  else loadCalls();
}

// Start
if (isAuthed()) document.getElementById('login-overlay').classList.add('hidden');
loadCalls();
// Auto-refresh every 2 minutes while on the dashboard
setInterval(() => { if (currentSection === 'dashboard' && !document.hidden) loadCalls(); }, 120000);
</script>
